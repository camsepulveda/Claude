# Netlify configuration for healthfrontgroup.com (Netlify project: healthfrontpr).
# The site is the static folder healthfront-site/. Settings here override the Netlify UI,
# so the deploy is correct whatever base/publish directories were typed there.
[build]
  base = "healthfront-site"
  publish = "."        # relative to base → healthfront-site/
  command = ""         # static files, nothing to build

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
